name: Parser CI
on:
  pull_request:
    paths:
      - pkg/parser/**
      - .github/workflows/parser-ci.yaml
defaults:
  run:
    shell: bash
    working-directory: pkg/parser
jobs:
  parser-ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.27.0'
      - name: Test
        run: go test ./...
      - name: Format
        run: go fmt ./...
      - name: go lint
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        continue-on-error: true
